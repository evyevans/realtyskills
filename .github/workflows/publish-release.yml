name: Publish verified release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
      - scripts/publish_release.py
      - docs/release-notes-v1.0.0.md
      - docs/verification.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realtyskills-v1-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'evyevans/realtyskills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Check catalog
        run: python3 scripts/render_catalog.py --check
      - name: Validate library
        run: python3 scripts/validate_library.py
      - name: Build verified downloads
        run: python3 scripts/build_releases.py
      - name: Verify release asset inventory
        run: python3 scripts/publish_release.py --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-downloads
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-downloads
          path: dist
      - name: Publish release and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
